version: '3.9'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: integrationhubspot_n8n
    restart: unless-stopped
    env_file:
      - .env.n8n
    environment:
      - TZ=Europe/Zurich
      - GENERIC_TIMEZONE=Europe/Zurich
    ports:
      - '127.0.0.1:15678:5678'
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
